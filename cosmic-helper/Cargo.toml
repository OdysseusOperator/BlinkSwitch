[package]
name = "blinkswitch-cosmic-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
